<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHUVO-SA · AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background aurora orbs -->
  <div class="aurora" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- App shell -->
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">SHUVO<em>SA</em></span>
      </div>

      <button class="btn-new-chat" id="clearBtn" title="New chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>

      <div class="sidebar-section-label">Recent</div>
      <div class="recent-list" id="recentList"></div>

      <div class="sidebar-footer">
        <div class="model-badge">
          <span class="dot"></span>
          GPT-4 · Live
        </div>
      </div>
    </aside>

    <!-- Main chat area -->
    <main class="chat-main">

      <!-- Header -->
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="header-title">
          <span class="header-name">SHUVO-SA</span>
          <span class="header-status"><span class="dot"></span> Online</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="clearBtn2" title="Clear chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </header>

      <!-- Messages area -->
      <div class="messages-wrap" id="messagesWrap">
        <div class="messages" id="messages">
          <!-- Welcome screen -->
          <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-icon">⚡</div>
            <h1 class="welcome-title">SHUVO-SA</h1>
            <p class="welcome-sub">Your intelligent AI companion. Ask me anything.</p>
            <div class="welcome-chips">
              <button class="chip" data-msg="What can you do?">What can you do?</button>
              <button class="chip" data-msg="Write me a poem about the cosmos">Write a poem ✨</button>
              <button class="chip" data-msg="Explain quantum computing simply">Explain quantum computing</button>
              <button class="chip" data-msg="Help me write a professional email">Draft an email 📧</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-wrapper" id="inputWrapper">
          <textarea
            id="messageInput"
            class="message-input"
            placeholder="Message SHUVO-SA…"
            rows="1"
            maxlength="500"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="input-controls">
            <span class="char-count" id="charCount">0/500</span>
            <button class="send-btn" id="sendBtn" title="Send message" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
        <p class="input-hint">SHUVO-SA can make mistakes. Verify important information.</p>
      </div>

    </main>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
